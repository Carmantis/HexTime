<!doctype html>
<!--
  data-theme is stamped here rather than set from JavaScript so the window
  never flashes the light theme before the app boots. Dark is the default;
  the user's saved choice replaces it at startup.
-->
<html lang="fi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HexTime</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
