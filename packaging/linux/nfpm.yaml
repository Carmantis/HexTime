# The .deb package, built by build-deb.sh with nfpm (https://nfpm.goreleaser.com).
#
# Paths under `contents` are relative to the staging folder build-deb.sh puts
# together (app/, icons/, hextime.desktop) and runs nfpm in.
#
# The app goes to /opt/hextime as PyInstaller built it. GTK and WebKitGTK are
# not inside it (see backend/pyinstaller/rthook_system_gtk.py), so they are
# declared as dependencies and apt installs them.
#
# Build on Ubuntu 24.04 (CI does): the bundled PyGObject is compiled against
# the build machine's GLib, so the package runs on that release and newer
# ones, not on older.

name: hextime
arch: amd64
platform: linux
# Set by build-deb.sh from backend/pyproject.toml.
version: ${VERSION}
section: utils
priority: optional
maintainer: Heikki Aittokumpu
description: |
  Work time tracking: timer, projects and tasks, billable hours,
  reports and PDF export. Finnish and English.
homepage: https://github.com/Carmantis/HexTime

depends:
  # Ubuntu 24.04 renamed the GTK library for the 64-bit time_t transition;
  # the alternative keeps older names working too.
  - libgtk-3-0t64 | libgtk-3-0
  - libwebkit2gtk-4.1-0
  - gir1.2-gtk-3.0
  - gir1.2-webkit2-4.1
  # PyGObject 3.52+ loads type information through girepository 2.0 (GLib 2.80).
  - libgirepository-2.0-0

contents:
  - src: ./app/
    dst: /opt/hextime/
    type: tree
  - src: /opt/hextime/hextime
    dst: /usr/bin/hextime
    type: symlink
  - src: ./hextime.desktop
    dst: /usr/share/applications/hextime.desktop
  - src: ./icons/hextime.svg
    dst: /usr/share/icons/hicolor/scalable/apps/hextime.svg
  - src: ./icons/hextime-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/hextime.png
