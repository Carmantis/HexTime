name: Release

# A version tag (v1.2.3) publishes the server image to the GitHub Container
# Registry, where deploy/hextime-install.sh pulls it from:
#
#   ghcr.io/carmantis/hextime:1.2.3   this version, for pinning
#   ghcr.io/carmantis/hextime:latest  what a new installation gets
#
# The desktop packages are built by hand for now (docs/docs/Run.md).

on:
  push:
    tags: ["v*"]
  # By hand, for trying the workflow; publishes nothing.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  server-image:
    name: Server image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The image name must be lower case; the owner may not be.
      - name: Image name
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hextime" >> "$GITHUB_OUTPUT"

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Containerfile
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
