name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (SQLite + PostgreSQL)
    runs-on: ubuntu-latest

    # The desktop build runs on SQLite and the server build on PostgreSQL.
    # Both have to pass, so the suite gets a real PostgreSQL here; the tests
    # that need it skip themselves when TEST_DATABASE_URL is unset.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: hextime
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:hextime@127.0.0.1:5432/postgres

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --frozen: fail if uv.lock does not match pyproject.toml, rather than
      # quietly resolving something different from what was committed.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Types
        run: npm run check

      - name: Tests
        run: npm test

      # Proves the production bundle builds, which is what FastAPI serves.
      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The tests start the backend in server mode through scripts/dev-server.sh.
      - name: Backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Tests
        working-directory: frontend
        run: npm run e2e

      # The trace of a failed test: every step, with screenshots and network.
      - name: Traces of failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          retention-days: 7
